<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A237E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200EA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A237E;stop-opacity:1" />
    </linearGradient>
    <filter id="glass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>

  <!-- Book base -->
  <path d="M30 70 L100 60 L170 70 L170 150 L100 140 L30 150 Z" fill="url(#bookGradient)" opacity="0.9" />
  <path d="M30 70 L100 60 L100 140 L30 150 Z" fill="url(#bookGradient)" opacity="0.8" />
  <path d="M100 60 L170 70 L170 150 L100 140 Z" fill="url(#bookGradient)" opacity="0.7" />

  <!-- Book spine -->
  <line x1="100" y1="60" x2="100" y2="140" stroke="#6200EA" stroke-width="2" />

  <!-- Circuit tree from spine -->
  <g stroke="url(#circuitGradient)" stroke-width="2" fill="none">
    <!-- Main trunk -->
    <path d="M100 65 Q100 85 100 100" />
    <!-- Branches -->
    <path d="M100 75 Q85 75 80 70" />
    <path d="M100 75 Q115 75 120 70" />
    <path d="M100 85 Q90 85 85 82" />
    <path d="M100 85 Q110 85 115 82" />
    <path d="M100 95 Q85 95 80 90" />
    <path d="M100 95 Q115 95 120 90" />
    <!-- Circuit nodes -->
    <circle cx="80" cy="70" r="3" fill="#00BFA5" />
    <circle cx="120" cy="70" r="3" fill="#00BFA5" />
    <circle cx="85" cy="82" r="2.5" fill="#00BFA5" />
    <circle cx="115" cy="82" r="2.5" fill="#00BFA5" />
    <circle cx="80" cy="90" r="3" fill="#00BFA5" />
    <circle cx="120" cy="90" r="3" fill="#00BFA5" />
  </g>

  <!-- Flame on top -->
  <g filter="url(#glass)">
    <path d="M100 65 Q90 50 100 30 Q110 50 100 65" fill="url(#flameGradient)" opacity="0.9" />
    <path d="M100 55 Q95 45 100 35 Q105 45 100 55" fill="url(#flameGradient)" opacity="0.7" />
  </g>

  <!-- Glass effect overlay -->
  <rect x="30" y="60" width="140" height="90" fill="white" opacity="0.1" rx="5" />
</svg>
